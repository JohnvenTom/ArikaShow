<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>星际通讯 | Interstellar Mail</title>
    <script src="js/gsap.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <link rel="stylesheet" href="css/email.css">
</head>

<body>
    <div class="starfield" id="starfield"></div>
    <div class="planet-decor planet-1"></div>
    <div class="planet-decor planet-2"></div>
    <div class="planet-decor planet-3"></div>
    <div class="nebula-line"></div>
    <div class="nebula-line"></div>

    <div class="page-title" data-text="Interstellar Mail">Interstellar Mail</div>
    <div class="page-subtitle">// 星际通讯终端 //</div>

    <form id="mailForm" autocomplete="off">
        <input type="hidden" name="_subject" value="星际通讯 - Interstellar Mail" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input type="text" name="_honey" style="display:none" autocomplete="off" />

    <div class="row" data_text="Your Name // 你的名字">
        <input class="row_input" name="name" if_finish="0"
            placeholder="输入你的名字..." autocomplete="off" />
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>
    <div class="row" data_text="Your Email // 你的邮箱">
        <input class="row_input" name="email" type="email" if_finish="0"
            placeholder="输入你的邮箱地址..." autocomplete="off" />
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>
    <div class="row" data_text="Subject // 通讯主题">
        <input class="row_input" name="subject" if_finish="0"
            placeholder="输入传输主题..." autocomplete="off" />
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>
    <div class="row message-row" data_text="Message // 通讯内容">
        <textarea class="row_input ctr_textarea" name="message" if_finish="0"
            placeholder="输入星际通讯内容..." rows="3" autocomplete="off"></textarea>
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>

    <button class="send-btn" type="submit">Transmit</button>
    </form>

    <div class="spaceship">
        <svg viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 30C5 30 20 10 60 10C100 10 115 30 115 30C115 30 100 50 60 50C20 50 5 30 5 30Z"
                fill="rgba(0,255,200,0.08)" stroke="rgba(0,255,200,0.6)" stroke-width="1" />
            <path d="M60 10L70 5L65 12" fill="rgba(0,255,200,0.3)" />
            <path d="M60 50L70 55L65 48" fill="rgba(0,255,200,0.3)" />
            <ellipse cx="60" cy="30" rx="18" ry="12" fill="rgba(0,200,255,0.15)"
                stroke="rgba(0,200,255,0.5)" stroke-width="0.8" />
            <ellipse cx="60" cy="30" rx="8" ry="5" fill="rgba(0,255,200,0.2)" />
            <path d="M2 30L8 26L8 34Z" fill="rgba(0,255,200,0.5)">
                <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite" />
            </path>
            <circle cx="45" cy="30" r="1.5" fill="rgba(0,255,200,0.6)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="75" cy="30" r="1.5" fill="rgba(0,255,200,0.6)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="0.5s"
                    repeatCount="indefinite" />
            </circle>
        </svg>
    </div>

    <div class="custom-cursor" id="customCursor"></div>

    <script src="js/email.js"></script>
</body>

</html>
