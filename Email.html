<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际通讯 | Interstellar Mail</title>
    <script src="example/009-checkable-form-main/gsap.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        * {
            font-size: 2vmin;
            padding: 0;
            margin: 0;
        }

        div {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding-top: 10rem;
            background-color: #050510;
            overflow-x: hidden;
            font-family: 'Rajdhani', sans-serif;
            cursor: none;
        }

        .custom-cursor {
            position: fixed;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-15%, -85%);
            transition: transform 0.1s ease-out;
        }

        .custom-cursor svg {
            animation: cursorGlow 2s ease-in-out infinite alternate;
        }

        @keyframes cursorGlow {
            0% {
                filter: drop-shadow(0 0 8px rgba(0, 255, 200, 0.9))
                        drop-shadow(0 0 25px rgba(0, 255, 200, 0.6))
                        drop-shadow(0 0 50px rgba(0, 255, 200, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(0, 255, 200, 1))
                        drop-shadow(0 0 40px rgba(0, 255, 200, 0.8))
                        drop-shadow(0 0 80px rgba(0, 200, 255, 0.5))
                        drop-shadow(0 0 120px rgba(0, 200, 255, 0.25));
            }
            100% {
                filter: drop-shadow(0 0 12px rgba(0, 255, 200, 1))
                        drop-shadow(0 0 35px rgba(0, 255, 200, 0.7))
                        drop-shadow(0 0 70px rgba(0, 200, 255, 0.4))
                        drop-shadow(0 0 100px rgba(0, 200, 255, 0.2));
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(1px 1px at 10% 20%, rgba(0, 255, 200, 0.8), transparent),
                radial-gradient(1px 1px at 30% 65%, rgba(100, 200, 255, 0.6), transparent),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(255, 255, 255, 0.9), transparent),
                radial-gradient(1px 1px at 70% 40%, rgba(0, 200, 255, 0.7), transparent),
                radial-gradient(1px 1px at 90% 80%, rgba(0, 255, 200, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 15% 85%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(1px 1px at 45% 50%, rgba(150, 100, 255, 0.6), transparent),
                radial-gradient(1px 1px at 80% 15%, rgba(0, 255, 200, 0.7), transparent),
                radial-gradient(1px 1px at 60% 90%, rgba(100, 200, 255, 0.5), transparent),
                radial-gradient(1.5px 1.5px at 25% 35%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1px 1px at 85% 55%, rgba(0, 200, 255, 0.4), transparent),
                radial-gradient(1px 1px at 5% 60%, rgba(150, 100, 255, 0.5), transparent);
            background-size: 100% 100%;
            pointer-events: none;
            z-index: 0;
            animation: starTwinkle 4s ease-in-out infinite alternate;
        }

        @keyframes starTwinkle {
            0% { opacity: 0.4; }
            30% { opacity: 0.9; }
            60% { opacity: 0.5; }
            80% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* ==================== 动态星星层 ==================== */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
        }
        @keyframes starBlinkA {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 6px 1px rgba(0, 255, 200, 0.6); }
        }
        @keyframes starBlinkB {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            33% { opacity: 0.9; transform: scale(1.3); box-shadow: 0 0 4px 1px rgba(100, 200, 255, 0.5); }
            66% { opacity: 0.4; transform: scale(0.85); }
        }
        @keyframes starBlinkC {
            0%, 100% { opacity: 0.15; }
            40% { opacity: 0.8; box-shadow: 0 0 8px 2px rgba(150, 100, 255, 0.4); }
            70% { opacity: 0.25; }
        }

        /* ==================== 流星效果 ==================== */
        .meteor {
            position: absolute;
            width: 120px;
            height: 2px;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
        }
        .meteor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                rgba(255, 255, 255, 1) 0%,
                rgba(0, 255, 200, 0.8) 40%,
                rgba(0, 255, 200, 0.3) 80%,
                rgba(0, 255, 200, 0) 100%);
            border-radius: 50%;
        }
        .meteor::after {
            content: '';
            position: absolute;
            left: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: var(--head-size, 2px);
            height: var(--head-size, 2px);
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 3px 1px rgba(255, 255, 255, 1),
                0 0 8px 2px rgba(0, 255, 200, 1),
                0 0 16px 4px rgba(0, 255, 200, 0.8),
                0 0 28px 8px rgba(0, 255, 200, 0.5),
                0 0 48px 14px rgba(0, 200, 255, 0.3);
            animation: meteorHeadFlicker var(--dur, 2s) linear forwards;
        }
        @keyframes meteorHeadFlicker {
            0% { opacity: 0; }
            25% { opacity: 1; }
            29% { opacity: 0.45; }
            35% { opacity: 1; }
            40% { opacity: 0.6; }
            46% { opacity: 1; }
            51% { opacity: 0.35; }
            57% { opacity: 0.9; }
            63% { opacity: 0.5; }
            69% { opacity: 1; }
            74% { opacity: 0.7; }
            79% { opacity: 1; }
            83% { opacity: 1; }
            89% { opacity: 0.6; }
            95% { opacity: 0.2; }
            100% { opacity: 0; }
        }
        @keyframes meteorFall {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(-35deg);
            }
            5% {
                opacity: 0.08;
            }
            10% {
                opacity: 0.22;
            }
            16% {
                opacity: 0.45;
            }
            22% {
                opacity: 0.7;
            }
            28% {
                opacity: 0.9;
            }
            34% {
                opacity: 1;
            }
            68% {
                opacity: 1;
            }
            78% {
                opacity: 0.7;
            }
            92% {
                opacity: 0.25;
            }
            100% {
                opacity: 0;
                transform: translate(var(--dist, -350px), var(--dist-y, 245px)) rotate(-35deg);
            }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 15% 80%, rgba(60, 0, 120, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 20%, rgba(0, 80, 150, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 40, 80, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .page-title {
            position: relative;
            z-index: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: #00ffc8;
            text-transform: uppercase;
            letter-spacing: 0.8rem;
            margin-bottom: 2rem;
            text-shadow:
                0 0 10px rgba(0, 255, 200, 0.8),
                0 0 30px rgba(0, 255, 200, 0.4),
                0 0 60px rgba(0, 255, 200, 0.2);
        }

        /* ==================== 全息干扰故障效果 ==================== */
        .page-title::before,
        .page-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            letter-spacing: inherit;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
        }
        .page-title {
            animation: hologramWave 3s ease-in-out infinite;
        }
        .page-title::before {
            color: rgba(0, 255, 255, 0.7);
            z-index: -1;
            animation: hologramDistort 2.5s ease-in-out infinite;
            filter: blur(0.5px);
        }
        .page-title::after {
            color: rgba(255, 0, 128, 0.6);
            z-index: -2;
            animation: hologramPhase 3s ease-in-out infinite reverse;
            filter: blur(1px);
        }
        @keyframes hologramWave {
            0%, 100% {
                transform: perspective(500px) rotateX(0deg) translateY(0);
                opacity: 1;
                filter: brightness(1);
            }
            25% {
                transform: perspective(500px) rotateX(2deg) translateY(-2px);
                opacity: 0.85;
                filter: brightness(1.1);
            }
            50% {
                transform: perspective(500px) rotateX(-1deg) translateY(1px);
                opacity: 0.95;
                filter: brightness(0.9);
            }
            75% {
                transform: perspective(500px) rotateX(1.5deg) translateY(-1px);
                opacity: 0.88;
                filter: brightness(1.05);
            }
        }
        @keyframes hologramDistort {
            0%, 100% {
                transform: translate(0) scaleY(1) scaleX(1);
                opacity: 0.7;
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
            20% {
                transform: translate(-3px, 1px) scaleY(1.02) scaleX(0.99);
                opacity: 0.5;
                clip-path: polygon(0 5%, 100% 0, 100% 95%, 0 100%);
            }
            40% {
                transform: translate(2px, -1px) scaleY(0.98) scaleX(1.01);
                opacity: 0.8;
                clip-path: polygon(0 0, 100% 3%, 100% 100%, 0 97%);
            }
            60% {
                transform: translate(-2px, 0) scaleY(1.01) scaleX(0.995);
                opacity: 0.6;
                clip-path: polygon(0 2%, 100% 0, 100% 98%, 0 100%);
            }
            80% {
                transform: translate(1px, 1px) scaleY(0.99) scaleX(1.005);
                opacity: 0.75;
                clip-path: polygon(0 0, 100% 4%, 100% 96%, 0 100%);
            }
        }
        @keyframes hologramPhase {
            0%, 100% {
                transform: translate(0) scaleY(1);
                opacity: 0.6;
                filter: blur(1px) brightness(0.9);
            }
            33% {
                transform: translate(4px, -2px) scaleY(1.03);
                opacity: 0.4;
                filter: blur(2px) brightness(1.1);
            }
            66% {
                transform: translate(-3px, 2px) scaleY(0.97);
                opacity: 0.7;
                filter: blur(0.5px) brightness(0.85);
            }
        }

        .page-subtitle {
            position: relative;
            z-index: 1;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            font-weight: 300;
            color: rgba(0, 200, 255, 0.6);
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            margin-bottom: 6rem;
        }

        .row {
            position: relative;
            justify-content: space-between;
            width: 50rem;
            margin-bottom: 10rem;
            z-index: 1;
        }

        .row::after {
            content: attr(data_text);
            position: absolute;
            left: 0;
            top: -3.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 400;
            color: rgba(0, 200, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            transition: 0.3s ease;
        }

        .row:hover::after {
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }

        .row_input {
            box-sizing: border-box;
            width: 80%;
            height: 4rem;
            border-radius: 5rem;
            background-color: rgba(10, 15, 30, 0.8);
            border: rgba(0, 200, 255, 0.3) 0.15rem solid;
            outline: none;
            padding: 0 2rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #e0f0ff;
            transition: 0.3s ease;
            cursor: none;
            backdrop-filter: blur(4px);
        }

        .row_input::placeholder {
            color: rgba(0, 200, 255, 0.25);
            font-weight: 300;
        }

        .row_input:focus {
            border: #00ffc8 0.15rem solid;
            box-shadow:
                0 0 15px rgba(0, 255, 200, 0.2),
                inset 0 0 15px rgba(0, 255, 200, 0.05);
            background-color: rgba(10, 20, 40, 0.9);
        }

        .row_selectbox {
            position: relative;
            width: 5rem;
            height: 5rem;
            fill: none;
            filter: drop-shadow(0 0 4px rgba(0, 200, 255, 0.3));
            transition: filter 0.3s ease, opacity 0.4s ease;
        }

        .row_selectbox::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 0.8rem;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(6px);
            border: rgba(0, 200, 255, 0.15) 0.1rem solid;
            z-index: -1;
            transition: all 0.4s ease;
        }

        .row_selectbox_finish::before {
            background: rgba(0, 255, 200, 0.08);
            border-color: rgba(0, 255, 200, 0.3);
            box-shadow: 0 0 12px rgba(0, 255, 200, 0.15);
        }

        .row_selectbox path:nth-child(1) {
            stroke: rgba(0, 200, 255, 0.4);
            stroke-width: 6;
            transition: stroke 0.3s ease;
        }

        .row_selectbox path:nth-child(2) {
            stroke: #00ffc8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 26;
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            filter: drop-shadow(0 0 6px rgba(0, 255, 200, 0.6));
            transition: stroke-dashoffset 0.5s ease, opacity 0.3s ease;
        }

        .row_selectbox_finish path:nth-child(1) {
            stroke: rgba(0, 255, 200, 0.6);
        }

        .row_selectbox_finish path:nth-child(2) {
            stroke-dashoffset: 0;
        }

        .spaceship {
            position: absolute;
            pointer-events: none;
            transform-origin: left center;
            z-index: 10;
        }

        .spaceship svg {
            position: relative;
            height: 100%;
            filter: drop-shadow(0 0 8px rgba(0, 255, 200, 0.5));
        }

        .planet-decor {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .planet-1 {
            width: 20rem;
            height: 20rem;
            top: -5rem;
            right: -8rem;
            background: radial-gradient(circle at 35% 35%,
                rgba(80, 40, 120, 0.3) 0%,
                rgba(40, 20, 80, 0.15) 40%,
                transparent 70%);
            box-shadow:
                inset -3rem -2rem 4rem rgba(0, 0, 0, 0.4),
                0 0 40px rgba(80, 40, 120, 0.15);
        }

        .planet-2 {
            width: 12rem;
            height: 12rem;
            bottom: 10rem;
            left: -4rem;
            background: radial-gradient(circle at 40% 30%,
                rgba(0, 80, 120, 0.25) 0%,
                rgba(0, 40, 80, 0.1) 50%,
                transparent 70%);
            box-shadow:
                inset -2rem -1.5rem 3rem rgba(0, 0, 0, 0.3),
                0 0 30px rgba(0, 80, 120, 0.1);
        }

        .planet-3 {
            width: 8rem;
            height: 8rem;
            top: 40%;
            right: 5%;
            background: radial-gradient(circle at 35% 35%,
                rgba(0, 100, 80, 0.2) 0%,
                rgba(0, 50, 40, 0.08) 50%,
                transparent 70%);
            box-shadow:
                inset -1.5rem -1rem 2rem rgba(0, 0, 0, 0.3),
                0 0 20px rgba(0, 100, 80, 0.08);
        }

        .nebula-line {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            height: 0.1rem;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.08), transparent);
        }

        .nebula-line:nth-child(1) {
            top: 30%;
            left: 0;
            width: 100%;
            transform: rotate(-3deg);
        }

        .nebula-line:nth-child(2) {
            top: 65%;
            left: 0;
            width: 100%;
            transform: rotate(2deg);
        }

        .send-btn {
            position: relative;
            z-index: 1;
            margin-top: 4rem;
            margin-bottom: 8rem;
            min-width: 20rem;
            width: fit-content;
            height: 4.5rem;
            border: 0.15rem solid rgba(0, 255, 200, 0.5);
            border-radius: 5rem;
            background: rgba(0, 255, 200, 0.05);
            color: #00ffc8;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            cursor: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
            overflow: visible;
            white-space: nowrap;
            padding: 0 2.5rem;
        }

        .send-btn:hover {
            background: rgba(0, 255, 200, 0.15);
            border-color: #00ffc8;
            box-shadow:
                0 0 20px rgba(0, 255, 200, 0.3),
                inset 0 0 20px rgba(0, 255, 200, 0.05);
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.8);
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        #mailForm {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .message-row {
            align-items: flex-start;
        }

        .ctr_textarea {
            box-sizing: border-box;
            width: 80%;
            min-height: 10rem;
            border-radius: 2rem;
            background-color: rgba(10, 15, 30, 0.8);
            border: rgba(0, 200, 255, 0.3) 0.15rem solid;
            outline: none;
            padding: 1.2rem 2rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #e0f0ff;
            transition: 0.3s ease;
            cursor: none;
            backdrop-filter: blur(4px);
            resize: none;
            line-height: 1.6;
            overflow: hidden;
        }

        .ctr_textarea::-webkit-scrollbar {
            display: none;
        }

        .ctr_textarea::placeholder {
            color: rgba(0, 200, 255, 0.25);
            font-weight: 300;
        }

        .ctr_textarea:focus {
            border: #00ffc8 0.15rem solid;
            box-shadow:
                0 0 15px rgba(0, 255, 200, 0.2),
                inset 0 0 15px rgba(0, 255, 200, 0.05);
            background-color: rgba(10, 20, 40, 0.9);
        }

        @media screen and (max-aspect-ratio: 1.2/1) {
            .row {
                width: 40rem;
                margin-bottom: 6rem;
            }

            .page-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="starfield" id="starfield"></div>
    <div class="planet-decor planet-1"></div>
    <div class="planet-decor planet-2"></div>
    <div class="planet-decor planet-3"></div>
    <div class="nebula-line"></div>
    <div class="nebula-line"></div>

    <div class="page-title" data-text="Interstellar Mail">Interstellar Mail</div>
    <div class="page-subtitle">// 星际通讯终端 //</div>

    <form id="mailForm" autocomplete="off">
        <input type="hidden" name="_subject" value="星际通讯 - Interstellar Mail" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input type="text" name="_honey" style="display:none" autocomplete="off" />

    <div class="row" data_text="Your Name // 你的名字">
        <input class="row_input" name="name" if_finish="0" onfocus="table.focus(this)" onblur="table.blur(this)"
            placeholder="输入你的名字..." autocomplete="off" />
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>
    <div class="row" data_text="Your Email // 你的邮箱">
        <input class="row_input" name="email" type="email" if_finish="0" onfocus="table.focus(this)" onblur="table.blur(this)"
            placeholder="输入你的邮箱地址..." autocomplete="off" />
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>
    <div class="row" data_text="Subject // 通讯主题">
        <input class="row_input" name="subject" if_finish="0" onfocus="table.focus(this)" onblur="table.blur(this)"
            placeholder="输入传输主题..." autocomplete="off" />
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>
    <div class="row message-row" data_text="Message // 通讯内容">
        <textarea class="row_input ctr_textarea" name="message" if_finish="0" onfocus="table.focus(this)" onblur="table.blur(this)"
            placeholder="输入星际通讯内容..." rows="3" autocomplete="off"></textarea>
        <svg class="row_selectbox" width="125" height="92" viewBox="0 0 125 92">
            <path d="M19,21H85V87H19V21Z" />
            <path d="M14,42L40,78l71-64" />
        </svg>
    </div>

    <button class="send-btn" type="submit">Transmit</button>
    </form>

    <div class="spaceship">
        <svg viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 30C5 30 20 10 60 10C100 10 115 30 115 30C115 30 100 50 60 50C20 50 5 30 5 30Z"
                fill="rgba(0,255,200,0.08)" stroke="rgba(0,255,200,0.6)" stroke-width="1" />
            <path d="M60 10L70 5L65 12" fill="rgba(0,255,200,0.3)" />
            <path d="M60 50L70 55L65 48" fill="rgba(0,255,200,0.3)" />
            <ellipse cx="60" cy="30" rx="18" ry="12" fill="rgba(0,200,255,0.15)"
                stroke="rgba(0,200,255,0.5)" stroke-width="0.8" />
            <ellipse cx="60" cy="30" rx="8" ry="5" fill="rgba(0,255,200,0.2)" />
            <path d="M2 30L8 26L8 34Z" fill="rgba(0,255,200,0.5)">
                <animate attributeName="opacity" values="0.3;1;0.3" dur="0.8s" repeatCount="indefinite" />
            </path>
            <circle cx="45" cy="30" r="1.5" fill="rgba(0,255,200,0.6)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="75" cy="30" r="1.5" fill="rgba(0,255,200,0.6)">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="0.5s"
                    repeatCount="indefinite" />
            </circle>
        </svg>
    </div>

    <div class="custom-cursor" id="customCursor"></div>
</body>
<script>
    /**
     * 星际通讯表单控制器
     * 管理飞船指针动画、输入验证和勾选动画
     */
    const table = {
        hand: document.querySelector(".spaceship"),
        timeline: gsap.timeline(),
        offset_distance: 0,

        /**
         * 根据勾选框位置重新计算飞船指针尺寸和位置
         */
        resize() {
            let refer_rect = document.querySelector(".row_selectbox").getBoundingClientRect();
            this.offset_distance = refer_rect.height / 3;
            this.hand.style.height = `${refer_rect.height * 5}px`;
            this.hand.style.left = `${refer_rect.left}px`;
            this.hand.style.top = `${refer_rect.top - this.hand.offsetHeight / 2 + this.offset_distance + scrollY}px`;
        },

        /**
         * 输入框获得焦点时飞船飞向该行
         * @param {HTMLElement} ele - 获得焦点的输入框
         */
        focus(ele) {
            let axis_y = ele.getBoundingClientRect().top;
            this.timeline.add(
                gsap.to(this.hand, {
                    top: `${axis_y - this.hand.offsetHeight / 2 + this.offset_distance + scrollY}px`,
                    duration: 0.4,
                    ease: "linear",
                })
            );
        },

        /**
         * 输入框失去焦点时判断是否填写完成
         * 有内容则触发完成动画，清空则触发取消动画
         * @param {HTMLElement} ele - 失去焦点的输入框
         */
        blur(ele) {
            let if_finish = parseInt(ele.getAttribute("if_finish"));
            if (ele.value != '' && !if_finish) {
                ele.setAttribute("if_finish", 1);
                this.input_finish_animate(ele);
            };
            if (ele.value == '' && if_finish) {
                ele.setAttribute("if_finish", 0);
                this.input_unfinish_animate(ele);
            };
        },

        /**
         * 输入完成动画 - 飞船抖动确认并勾选
         * @param {HTMLElement} ele - 完成输入的元素
         */
        input_finish_animate(ele) {
            let svg = ele.nextElementSibling;
            let checkPath = svg.querySelector('path:nth-child(2)');
            gsap.killTweensOf([svg, checkPath]);
            svg.style.opacity = '';
            checkPath.style.strokeDashoffset = '';
            this.timeline.add(
                gsap.timeline()
                    .to(this.hand, {
                        rotate: '5deg',
                        x: "3%",
                        y: "7%",
                        duration: 0.2,
                        ease: "linear",
                        onStart: () => {
                            svg.classList.add("row_selectbox_finish");
                        }
                    })
                    .to(this.hand, {
                        rotate: '-2deg',
                        x: "9%",
                        y: "-6%",
                        duration: 0.2,
                        ease: "linear",
                    })
                    .to(this.hand, {
                        rotate: 0,
                        x: 0,
                        y: 0,
                        duration: 0.3,
                        ease: "linear",
                    })
            );
        },

        /**
         * 取消完成动画 - 飞船回退并取消勾选（带淡出效果）
         * @param {HTMLElement} ele - 取消输入的元素
         */
        input_unfinish_animate(ele) {
            let svg = ele.nextElementSibling;
            this.timeline.add(
                gsap.timeline()
                    .to(this.hand, {
                        x: "-25%",
                        y: "10%",
                        duration: 0.3,
                        ease: "linear",
                    })
                    .to(svg, {
                        opacity: 0.3,
                        duration: 0.25,
                        ease: "power2.in",
                    }, "-=0.1")
                    .to(svg.querySelector('path:nth-child(2)'), {
                        strokeDashoffset: 150,
                        duration: 0.35,
                        ease: "power2.inOut",
                    }, "-=0.2")
                    .to(this.hand, {
                        x: 0,
                        y: 0,
                        duration: 0.2,
                        ease: "linear",
                    })
                    .to(svg, {
                        opacity: 1,
                        duration: 0.2,
                        ease: "power2.out",
                        onStart: () => {
                            svg.classList.remove("row_selectbox_finish");
                        }
                    }, "-=0.1")
            );
        },
    }

    /**
     * textarea自动扩容
     * 根据内容动态调整高度
     */
    const textarea = document.querySelector('.ctr_textarea');
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
    });

    /**
     * 表单提交验证 + 成功后自动跳转
     * 验证通过后：设置标记 → fetch发送表单 → 成功才跳转blackhole.html
     */
    document.getElementById('mailForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const inputs = document.querySelectorAll('.row_input');
        let allFinished = true;
        inputs.forEach(input => {
            if (input.value === '') {
                allFinished = false;
                input.style.borderColor = 'rgba(255, 100, 100, 0.6)';
                setTimeout(() => {
                    input.style.borderColor = '';
                }, 1500);
            }
        });

        if (!allFinished) return;

        const btn = document.querySelector('.send-btn');
        btn.textContent = '⚡ TRANSMITTING...';
        btn.style.letterSpacing = '0.15rem';
        btn.style.background = 'rgba(0, 255, 200, 0.2)';
        btn.style.boxShadow = '0 0 30px rgba(0, 255, 200, 0.4)';
        btn.disabled = true;

        sessionStorage.setItem('fromEmailSubmit', 'true');

        const formData = new FormData(this);

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        fetch('https://formsubmit.co/ajax/3040791779@qq.com', {
            method: 'POST',
            body: formData,
            signal: controller.signal
        })
        .then(response => {
            clearTimeout(timeoutId);
            if (response.ok || response.type === 'opaque') {
                window.location.href = 'blackhole.html';
            } else {
                throw new Error(`HTTP ${response.status}`);
            }
        })
        .catch(error => {
            clearTimeout(timeoutId);
            console.error('发送异常:', error);
            btn.textContent = '❌ FAILED - RETRY';
            btn.style.letterSpacing = '0.2rem';
            btn.style.background = 'rgba(255, 80, 80, 0.15)';
            btn.style.borderColor = 'rgba(255, 100, 100, 0.5)';
            btn.disabled = false;
            setTimeout(() => {
                btn.textContent = 'Transmit';
                btn.style.background = '';
                btn.style.borderColor = '';
                btn.style.boxShadow = '';
                btn.style.letterSpacing = '';
            }, 2500);
        });
    });

    window.addEventListener("load", () => {
        table.resize();
        initCustomCursor();
        initStarfield();
    });
    window.addEventListener("resize", () => {
        table.resize();
    });

    /**
     * 星空背景控制器
     * 动态生成闪烁星星和随机流星
     */
    function initStarfield() {
        const container = document.getElementById('starfield');
        const blinkStyles = ['starBlinkA', 'starBlinkB', 'starBlinkC'];
        const starColors = [
            '#ffffff', 'rgba(0,255,200,0.9)', 'rgba(100,200,255,0.85)',
            'rgba(150,100,255,0.8)', 'rgba(255,255,255,0.7)'
        ];

        /**
         * 生成随机位置的闪烁星星
         * @param {number} count - 星星数量
         */
        function createStars(count) {
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.background = starColors[Math.floor(Math.random() * starColors.length)];
                const animStyle = blinkStyles[Math.floor(Math.random() * blinkStyles.length)];
                star.style.animation = `${animStyle} ${2 + Math.random() * 4}s ease-in-out infinite`;
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }

        /**
         * 创建单颗流星并播放动画后自动销毁
         * 大小、存活时间、飞行距离均随机化
         */
        function spawnMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            const size = 60 + Math.random() * 140;
            const headSize = 1.5 + size * 0.015;
            const dist = 250 + size * 2.5;
            meteor.style.width = size + 'px';
            meteor.style.height = (1 + Math.random() * 1.5) + 'px';
            meteor.style.left = (20 + Math.random() * 75) + '%';
            meteor.style.top = (-10 + Math.random() * 45) + '%';
            meteor.style.setProperty('--head-size', headSize + 'px');
            meteor.style.setProperty('--dist', -dist + 'px');
            meteor.style.setProperty('--dist-y', dist * 0.7 + 'px');
            const duration = 1.2 + Math.random() * 2.8;
            meteor.style.setProperty('--dur', duration + 's');
            meteor.style.animation = `meteorFall ${duration}s linear forwards`;
            container.appendChild(meteor);
            meteor.addEventListener('animationend', () => meteor.remove());
        }

        createStars(60);

        setInterval(() => {
            if (Math.random() > 0.3) spawnMeteor();
        }, 2500);

        setTimeout(spawnMeteor, 800);
        setTimeout(spawnMeteor, 1800);
    }

    /**
     * 自定义光标控制器
     * 管理Lottie动画光标、出场动画和点击交互
     */
    function initCustomCursor() {
        const cursorContainer = document.getElementById('customCursor');
        let introAnim, clickAnim;
        let isIntroComplete = false;

        /**
         * 初始化出场动画 - in-dynamic.json
         * 页面加载时播放一次，结束后暂停在最后一帧
         */
        introAnim = lottie.loadAnimation({
            container: cursorContainer,
            renderer: 'svg',
            loop: false,
            autoplay: true,
            path: 'Js/wired-outline-35-edit-in-dynamic.json'
        });

        /**
         * 出场动画完成事件
         * 动画结束后销毁实例并清空容器，再加载点击动画
         */
        introAnim.addEventListener('complete', () => {
            isIntroComplete = true;
            introAnim.destroy();
            cursorContainer.innerHTML = '';

            /**
             * 初始化点击动画 - hover-line.json
             * 初始状态为暂停，等待用户点击触发
             */
            clickAnim = lottie.loadAnimation({
                container: cursorContainer,
                renderer: 'svg',
                loop: false,
                autoplay: false,
                path: 'Js/wired-outline-35-edit-hover-line.json'
            });
            clickAnim.goToAndStop(0, true);
        });

        /**
         * 鼠标移动事件
         * 记录目标位置，由requestAnimationFrame驱动平滑插值跟随
         */
        let cursorTargetX = 0, cursorTargetY = 0;
        let cursorCurrentX = 0, cursorCurrentY = 0;
        document.addEventListener('mousemove', (e) => {
            cursorTargetX = e.clientX;
            cursorTargetY = e.clientY;
        });
        function smoothCursorFollow() {
            cursorCurrentX += (cursorTargetX - cursorCurrentX) * 0.12;
            cursorCurrentY += (cursorTargetY - cursorCurrentY) * 0.12;
            cursorContainer.style.left = cursorCurrentX + 'px';
            cursorContainer.style.top = cursorCurrentY + 'px';
            requestAnimationFrame(smoothCursorFollow);
        }
        requestAnimationFrame(smoothCursorFollow);

        /**
         * 点击事件处理
         * 播放hover-line点击动画，每次点击从头开始播放
         */
        document.addEventListener('click', () => {
            if (isIntroComplete && clickAnim) {
                clickAnim.goToAndStop(0, true);
                clickAnim.play();
            }
        });
    }
</script>
