<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑洞渲染 - Black Hole Render</title>
    <link rel="stylesheet" href="css/blackhole.css">
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="loading">正在加载黑洞模型...</div>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <div>鼠标左键：旋转视角</div>
        <div>鼠标右键：平移</div>
        <div>滚轮：缩放</div>
    </div>

    <div class="win-dialog" id="successDialog">
        <div class="win-titlebar" id="dialogTitlebar">
            <div class="win-titlebar-left">
                <svg class="win-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span class="win-title">星际通讯系统</span>
            </div>
            <div class="win-controls">
                <button class="win-btn" id="btnMinimize" title="关闭">
                    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor"><line x1="2" y1="7" x2="12" y2="7"/></svg>
                </button>
                <button class="win-btn" id="btnClose" title="关闭">
                    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg>
                </button>
            </div>
        </div>
        <div class="win-body">
            <svg class="win-icon-large" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="28" fill="none" stroke="#00d4ff" stroke-width="2.5"/>
                <path d="M20 32 L28 40 L44 24" fill="none" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="32" cy="32" r="22" fill="rgba(0,212,255,0.08)"/>
            </svg>
            <div class="win-message">
                <span class="win-message-highlight">宇宙漂流瓶</span><br/>提交成功!!
            </div>
        </div>
    </div>

    <script type="module" src="js/blackhole.js"></script>
    <script src="js/blackhole-dialog.js"></script>
</body>
</html>
