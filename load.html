<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在星际通讯中 | Interstellar Communication</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ========== 全局样式 - 星际通讯终端 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Orbitron', 'Share Tech Mono', monospace;
            overflow: hidden;
            position: relative;
        }

        /* 深空背景 */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 150, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 255, 200, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, #0a0a1a 0%, #000005 100%);
            z-index: -3;
        }

        /* 星空粒子 - 更多更亮更随机 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        /* 不同亮度的星星 */
        .star.dim {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .star.normal {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        .star.bright {
            background: rgba(255, 255, 255, 0.95);
            box-shadow:
                0 0 6px rgba(255, 255, 255, 0.8),
                0 0 12px rgba(200, 230, 255, 0.4);
        }

        .star.super-bright {
            background: #fff;
            box-shadow:
                0 0 8px rgba(255, 255, 255, 1),
                0 0 16px rgba(200, 230, 255, 0.6),
                0 0 24px rgba(150, 200, 255, 0.3);
        }

        /* 彩色星星 */
        .star.blue {
            background: rgba(150, 200, 255, 0.9);
            box-shadow: 0 0 6px rgba(150, 200, 255, 0.7);
        }

        .star.cyan {
            background: rgba(0, 255, 200, 0.8);
            box-shadow: 0 0 6px rgba(0, 255, 200, 0.5);
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: var(--min-opacity);
                transform: scale(var(--min-scale));
            }
            50% {
                opacity: var(--max-opacity);
                transform: scale(var(--max-scale));
            }
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 200, 0.03) 2px,
                rgba(0, 255, 200, 0.03) 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* 主容器 */
        .comm-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* ========== 通讯终端 ========== */
        .comm-terminal {
            position: relative;
            width: 400px;
            padding: 40px;
            background: linear-gradient(180deg,
                rgba(10, 20, 40, 0.9) 0%,
                rgba(5, 10, 25, 0.95) 100%
            );
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 20px;
            box-shadow:
                0 0 60px rgba(0, 150, 255, 0.2),
                inset 0 2px 4px rgba(100, 200, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        /* 终端角落装饰 */
        .terminal-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 255, 200, 0.5);
        }

        .terminal-corner.tl {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .terminal-corner.tr {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
        }

        .terminal-corner.bl {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
        }

        .terminal-corner.br {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
        }

        /* ========== 信号指示器 ========== */
        .signal-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .signal-bar {
            width: 6px;
            height: 30px;
            background: rgba(0, 255, 200, 0.2);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .signal-bar.active {
            background: rgba(0, 255, 200, 0.9);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.8);
        }

        .signal-bar:nth-child(1).active { height: 15px; }
        .signal-bar:nth-child(2).active { height: 20px; }
        .signal-bar:nth-child(3).active { height: 25px; }
        .signal-bar:nth-child(4).active { height: 30px; }
        .signal-bar:nth-child(5).active { height: 35px; }

        /* ========== 通讯图标 ========== */
        .comm-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            position: relative;
        }

        .comm-icon svg {
            width: 100%;
            height: 100%;
            color: rgba(0, 255, 200, 0.9);
            filter: drop-shadow(0 0 20px rgba(0, 255, 200, 0.6));
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(0, 255, 200, 0.6));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 30px rgba(0, 255, 200, 0.9));
            }
        }

        /* 信号波纹 */
        .signal-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 50%;
            opacity: 0;
        }

        .signal-wave:nth-child(1) { animation: waveExpand 2s ease-out infinite; }
        .signal-wave:nth-child(2) { animation: waveExpand 2s ease-out infinite 0.5s; }
        .signal-wave:nth-child(3) { animation: waveExpand 2s ease-out infinite 1s; }

        @keyframes waveExpand {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        /* ========== 状态信息面板 ========== */
        .status-panel {
            text-align: center;
        }

        /* 主标题 */
        .main-title {
            font-family: 'VT323', 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 400;
            color: #00ffc8;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow:
                0 0 10px rgba(0, 255, 200, 0.8),
                0 0 20px rgba(0, 255, 200, 0.6),
                2px 0 0 rgba(255, 0, 100, 0.3),
                -2px 0 0 rgba(0, 150, 255, 0.3);
            margin-bottom: 15px;
            animation: titleGlitch 3s ease-in-out infinite;
        }

        @keyframes titleGlitch {
            0%, 90%, 100% {
                text-shadow:
                    0 0 10px rgba(0, 255, 200, 0.8),
                    0 0 20px rgba(0, 255, 200, 0.6),
                    2px 0 0 rgba(255, 0, 100, 0.3),
                    -2px 0 0 rgba(0, 150, 255, 0.3);
            }
            91% {
                text-shadow:
                    0 0 10px rgba(0, 255, 200, 0.8),
                    4px 0 0 rgba(255, 0, 100, 0.5),
                    -4px 0 0 rgba(0, 150, 255, 0.5);
            }
            92% {
                text-shadow:
                    0 0 10px rgba(0, 255, 200, 0.8),
                    -2px 0 0 rgba(255, 0, 100, 0.5),
                    2px 0 0 rgba(0, 150, 255, 0.5);
            }
        }

        /* 副标题 */
        .sub-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: rgba(0, 200, 255, 0.7);
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        /* 频率显示 */
        .freq-display {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            color: #00ffc8;
            letter-spacing: 8px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.6);
        }

        .freq-display .label {
            font-size: 1rem;
            color: rgba(0, 200, 255, 0.5);
            margin-right: 10px;
        }

        /* 进度条容器 */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(0, 50, 100, 0.3);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 200, 255, 0.2);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,
                rgba(0, 255, 200, 0.8) 0%,
                rgba(0, 200, 255, 1) 50%,
                rgba(0, 255, 200, 0.8) 100%
            );
            box-shadow:
                0 0 15px rgba(0, 255, 200, 0.8),
                0 0 30px rgba(0, 200, 255, 0.4);
            transition: width 0.1s linear;
        }

        /* 状态信息 */
        .status-info {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: rgba(0, 200, 255, 0.6);
            letter-spacing: 2px;
            min-height: 20px;
        }

        .status-info .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: rgba(0, 255, 200, 0.8);
            margin-left: 5px;
            animation: cursorBlink 0.5s step-end infinite;
            vertical-align: middle;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ========== 角落装饰 ========== */
        .corner-decoration {
            position: fixed;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(0, 255, 200, 0.3);
            z-index: 50;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        /* ========== 连接成功效果 ========== */
        .connect-success {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center,
                rgba(0, 255, 200, 0.2) 0%,
                transparent 70%
            );
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
        }

        .connect-success.active {
            animation: successFlash 0.8s ease-out forwards;
        }

        @keyframes successFlash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* ========== 画面横向撕裂效果 ========== */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        .glitch-overlay.active {
            opacity: 1;
        }

        .tear-stripe {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            opacity: 0;
        }

        .tear-stripe.active {
            animation: stripeTear 0.15s ease-out;
        }

        @keyframes stripeTear {
            0% { opacity: 0; transform: translateX(0); }
            10% { opacity: 1; transform: translateX(-10px); }
            30% { opacity: 1; transform: translateX(8px); }
            50% { opacity: 1; transform: translateX(-6px); }
            70% { opacity: 0.8; transform: translateX(4px); }
            100% { opacity: 0; transform: translateX(0); }
        }

        /* 整体画面抖动 */
        .screen-shake {
            animation: horizontalShake 0.15s ease-in-out;
        }

        @keyframes horizontalShake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px); }
            20% { transform: translateX(6px); }
            30% { transform: translateX(-10px); }
            40% { transform: translateX(8px); }
            50% { transform: translateX(-6px); }
            60% { transform: translateX(4px); }
            70% { transform: translateX(-4px); }
            80% { transform: translateX(2px); }
            90% { transform: translateX(-2px); }
        }

        /* 通讯终端撕裂效果 */
        .comm-terminal.glitch-tear {
            animation: terminalTear 0.2s ease-out;
        }

        @keyframes terminalTear {
            0% {
                transform: translateX(0);
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
            10% {
                transform: translateX(-5px);
                clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%);
            }
            20% {
                transform: translateX(4px);
                clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%);
            }
            30% {
                transform: translateX(-6px);
                clip-path: polygon(0 75%, 100% 75%, 100% 80%, 0 80%);
            }
            40% {
                transform: translateX(5px);
                clip-path: polygon(0 35%, 100% 35%, 100% 40%, 0 40%);
            }
            50% {
                transform: translateX(-4px);
                clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%);
            }
            60% {
                transform: translateX(3px);
                clip-path: polygon(0 15%, 100% 15%, 100% 20%, 0 20%);
            }
            70% {
                transform: translateX(-3px);
                clip-path: polygon(0 85%, 100% 85%, 100% 90%, 0 90%);
            }
            80% {
                transform: translateX(2px);
                clip-path: polygon(0 45%, 100% 45%, 100% 50%, 0 50%);
            }
            90% {
                transform: translateX(-1px);
                clip-path: polygon(0 70%, 100% 70%, 100% 75%, 0 75%);
            }
            100% {
                transform: translateX(0);
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 768px) {
            .comm-terminal {
                width: 90%;
                padding: 30px 20px;
            }

            .main-title {
                font-size: 2.2rem;
                letter-spacing: 4px;
            }

            .comm-icon {
                width: 80px;
                height: 80px;
            }

            .freq-display {
                font-size: 1.5rem;
            }

            .corner-decoration {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- 深空背景 -->
    <div class="space-bg"></div>

    <!-- 星空 -->
    <div class="stars" id="stars"></div>

    <!-- 扫描线 -->
    <div class="scanlines"></div>

    <!-- 角落装饰 -->
    <div class="corner-decoration corner-tl"></div>
    <div class="corner-decoration corner-tr"></div>
    <div class="corner-decoration corner-bl"></div>
    <div class="corner-decoration corner-br"></div>

    <!-- 主容器 -->
    <div class="comm-container">
        <!-- 通讯终端 -->
        <div class="comm-terminal">
            <!-- 终端角落装饰 -->
            <div class="terminal-corner tl"></div>
            <div class="terminal-corner tr"></div>
            <div class="terminal-corner bl"></div>
            <div class="terminal-corner br"></div>

            <!-- 信号指示器 -->
            <div class="signal-indicator" id="signalIndicator">
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
            </div>

            <!-- 通讯图标 -->
            <div class="comm-icon">
                <div class="signal-wave"></div>
                <div class="signal-wave"></div>
                <div class="signal-wave"></div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <!-- 电话听筒 -->
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    <!-- 信号波纹 -->
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2a10 10 0 0110 10" opacity="0.6"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6a6 6 0 016 6" opacity="0.4"/>
                </svg>
            </div>

            <!-- 状态面板 -->
            <div class="status-panel">
                <h1 class="main-title">CALLING</h1>
                <p class="sub-title">INTERSTELLAR COMMUNICATION</p>

                <!-- 频率显示 -->
                <div class="freq-display">
                    <span class="label">FREQ:</span>
                    <span id="freqValue">---</span>
                </div>

                <!-- 进度条 -->
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <!-- 状态信息 -->
                <div class="status-info" id="statusInfo">
                    建立连接...<span class="cursor"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 连接成功效果 -->
    <div class="connect-success" id="connectSuccess"></div>

    <!-- 画面撕裂效果层 -->
    <div class="glitch-overlay" id="glitchOverlay"></div>

    <script>
        /**
         * 星际通讯控制器
         * 负责管理通讯连接动画、信号显示和页面跳转
         */
        class InterstellarComm {
            constructor() {
                // 目标页面URL
                this.targetUrl = this.getTargetUrl();

                // 进度状态
                this.progress = 0;
                this.isComplete = false;

                // DOM元素
                this.progressBar = document.getElementById('progressBar');
                this.freqValue = document.getElementById('freqValue');
                this.statusInfo = document.getElementById('statusInfo');
                this.signalIndicator = document.getElementById('signalIndicator');
                this.connectSuccess = document.getElementById('connectSuccess');

                // 状态消息列表
                this.statusMessages = [
                    { progress: 0, message: '建立连接...' },
                    { progress: 15, message: '扫描频率...' },
                    { progress: 30, message: '信号同步中...' },
                    { progress: 45, message: '验证通讯协议...' },
                    { progress: 60, message: '加密通道建立...' },
                    { progress: 75, message: '信号增强中...' },
                    { progress: 90, message: '通讯就绪...' },
                    { progress: 100, message: '连接成功' }
                ];

                // 频率值
                this.baseFreq = 1010;

                // 初始化
                this.init();
            }

            /**
             * 从URL参数获取目标页面
             * @returns {string} 目标页面URL
             */
            getTargetUrl() {
                const params = new URLSearchParams(window.location.search);
                const target = params.get('target');
                return target || 'contact call.html';
            }

            /**
             * 初始化系统
             */
            init() {
                this.generateStars();
                this.startSignalAnimation();
                this.startProgress();
                this.startFreqAnimation();
                // 启动随机撕裂效果
                this.startRandomGlitch();
            }

            /**
             * 启动随机撕裂效果
             * 随机触发多种画面横向撕裂效果
             */
            startRandomGlitch() {
                const triggerGlitch = () => {
                    // 随机决定是否触发（40%概率）
                    if (Math.random() > 0.6) {
                        this.triggerGlitchEffect();
                    }
                    // 随机间隔下次触发（0.5-2秒）
                    const nextGlitch = 500 + Math.random() * 1500;
                    setTimeout(triggerGlitch, nextGlitch);
                };
                // 首次延迟后启动
                setTimeout(triggerGlitch, 1000);
            }

            /**
             * 触发画面撕裂效果
             * 包含整体抖动、终端撕裂和随机条纹
             */
            triggerGlitchEffect() {
                const terminal = document.querySelector('.comm-terminal');
                const body = document.body;
                const overlay = document.getElementById('glitchOverlay');

                // 1. 整体画面抖动
                body.classList.add('screen-shake');
                setTimeout(() => body.classList.remove('screen-shake'), 150);

                // 2. 通讯终端撕裂效果
                if (terminal) {
                    terminal.classList.add('glitch-tear');
                    setTimeout(() => terminal.classList.remove('glitch-tear'), 200);
                }

                // 3. 生成随机撕裂条纹
                this.createTearStripes();

                // 4. 经常连续触发多次（50%概率）
                if (Math.random() > 0.5) {
                    setTimeout(() => this.triggerGlitchEffect(), 200);
                }
            }

            /**
             * 创建随机撕裂条纹
             */
            createTearStripes() {
                const overlay = document.getElementById('glitchOverlay');
                if (!overlay) return;

                // 清除旧条纹
                overlay.innerHTML = '';
                overlay.classList.add('active');

                // 随机生成2-5条撕裂条纹
                const stripeCount = 2 + Math.floor(Math.random() * 4);
                const colors = [
                    'rgba(0, 255, 200, 0.3)',
                    'rgba(0, 200, 255, 0.3)',
                    'rgba(255, 0, 100, 0.2)',
                    'rgba(255, 255, 0, 0.2)',
                    'rgba(255, 255, 255, 0.4)'
                ];

                for (let i = 0; i < stripeCount; i++) {
                    const stripe = document.createElement('div');
                    stripe.className = 'tear-stripe';

                    // 随机位置（屏幕高度的10%-90%）
                    const topPos = 10 + Math.random() * 80;
                    stripe.style.top = `${topPos}%`;

                    // 随机高度
                    stripe.style.height = `${2 + Math.random() * 4}px`;

                    // 随机颜色
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    stripe.style.backgroundColor = color;
                    stripe.style.boxShadow = `0 0 ${3 + Math.random() * 5}px ${color}`;

                    // 随机宽度偏移（模拟撕裂错位）
                    const offset = -20 + Math.random() * 40;
                    stripe.style.transform = `translateX(${offset}px)`;

                    overlay.appendChild(stripe);

                    // 触发动画
                    setTimeout(() => {
                        stripe.classList.add('active');
                    }, i * 30);
                }

                // 清理
                setTimeout(() => {
                    overlay.classList.remove('active');
                    overlay.innerHTML = '';
                }, 200);
            }

            /**
             * 生成星空背景
             */
            generateStars() {
                const starsContainer = document.getElementById('stars');
                // 更多星星：从100增加到250
                const starCount = 250;

                // 星星类型分布
                const starTypes = [
                    { class: 'dim', weight: 30 },
                    { class: 'normal', weight: 35 },
                    { class: 'bright', weight: 20 },
                    { class: 'super-bright', weight: 8 },
                    { class: 'blue', weight: 4 },
                    { class: 'cyan', weight: 3 }
                ];

                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');

                    // 根据权重随机选择星星类型
                    const random = Math.random() * 100;
                    let cumulativeWeight = 0;
                    let starClass = 'normal';
                    for (const type of starTypes) {
                        cumulativeWeight += type.weight;
                        if (random <= cumulativeWeight) {
                            starClass = type.class;
                            break;
                        }
                    }
                    star.className = `star ${starClass}`;

                    // 随机位置
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;

                    // 根据类型设置大小
                    let size;
                    switch (starClass) {
                        case 'dim': size = 1 + Math.random() * 1.5; break;
                        case 'normal': size = 1.5 + Math.random() * 2; break;
                        case 'bright': size = 2 + Math.random() * 2; break;
                        case 'super-bright': size = 2.5 + Math.random() * 2.5; break;
                        case 'blue':
                        case 'cyan': size = 2 + Math.random() * 2; break;
                        default: size = 1.5 + Math.random() * 2;
                    }

                    // 更随机的闪烁参数
                    // 持续时间：0.3-2.5秒（更快更随机）
                    const duration = 0.3 + Math.random() * 2.2;
                    // 延迟：0-8秒（更分散）
                    const delay = Math.random() * 8;
                    // 最小/最大透明度（更随机）
                    const minOpacity = 0.2 + Math.random() * 0.4;
                    const maxOpacity = 0.7 + Math.random() * 0.3;
                    // 最小/最大缩放（更随机）
                    const minScale = 0.8 + Math.random() * 0.4;
                    const maxScale = 1.2 + Math.random() * 0.8;

                    star.style.left = `${x}%`;
                    star.style.top = `${y}%`;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.setProperty('--duration', `${duration}s`);
                    star.style.setProperty('--delay', `${delay}s`);
                    star.style.setProperty('--min-opacity', minOpacity);
                    star.style.setProperty('--max-opacity', maxOpacity);
                    star.style.setProperty('--min-scale', minScale);
                    star.style.setProperty('--max-scale', maxScale);

                    starsContainer.appendChild(star);
                }
            }

            /**
             * 启动信号条动画
             */
            startSignalAnimation() {
                const bars = this.signalIndicator.querySelectorAll('.signal-bar');
                let activeIndex = 0;

                setInterval(() => {
                    bars.forEach((bar, index) => {
                        bar.classList.toggle('active', index <= activeIndex);
                    });
                    activeIndex = (activeIndex + 1) % bars.length;
                }, 300);
            }

            /**
             * 启动频率动画
             */
            startFreqAnimation() {
                setInterval(() => {
                    if (this.isComplete) return;
                    const randomOffset = Math.floor(Math.random() * 20) - 10;
                    const freq = this.baseFreq + randomOffset;
                    this.freqValue.textContent = freq.toString().padStart(4, '0');
                }, 100);
            }

            /**
             * 开始进度动画
             */
            startProgress() {
                const duration = 2500;
                const startTime = Date.now();

                const updateProgress = () => {
                    const elapsed = Date.now() - startTime;
                    const rawProgress = Math.min((elapsed / duration) * 100, 100);

                    this.progress = this.easeOutCubic(rawProgress / 100) * 100;

                    this.updateUI();
                    this.updateStatusMessage();

                    if (this.progress < 100) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        this.onComplete();
                    }
                };

                requestAnimationFrame(updateProgress);
            }

            /**
             * 缓动函数 - easeOutCubic
             */
            easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            /**
             * 更新UI显示
             */
            updateUI() {
                this.progressBar.style.width = `${this.progress}%`;
            }

            /**
             * 更新状态消息
             */
            updateStatusMessage() {
                const message = this.statusMessages
                    .slice()
                    .reverse()
                    .find(m => this.progress >= m.progress);

                if (message && this.statusInfo.textContent !== message.message) {
                    this.statusInfo.innerHTML = message.message + '<span class="cursor"></span>';
                }
            }

            /**
             * 进度完成回调
             */
            onComplete() {
                if (this.isComplete) return;
                this.isComplete = true;

                // 显示连接成功效果
                this.triggerSuccessEffect();

                // 延迟后跳转
                setTimeout(() => {
                    window.location.href = this.targetUrl;
                }, 1000);
            }

            /**
             * 触发连接成功效果
             */
            triggerSuccessEffect() {
                this.connectSuccess.classList.add('active');
                this.freqValue.textContent = 'CONNECTED';
                this.freqValue.style.color = '#00ff88';

                // 播放音效（如果支持）
                this.playConnectSound();
            }

            /**
             * 播放连接成功音效
             */
            playConnectSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.frequency.setValueAtTime(440, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.1);

                    osc.type = 'sine';

                    gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.start();
                    osc.stop(audioContext.currentTime + 0.5);
                } catch (e) {
                    console.warn('Audio not supported');
                }
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            new InterstellarComm();
        });
    </script>
</body>
</html>
