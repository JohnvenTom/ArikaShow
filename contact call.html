<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际通讯终端 | Interstellar Comm Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/contact-call.css">
</head>
<body>
    <div class="terminal-container">
        <!-- 通讯耳机 -->
        <div class="headset" id="headset">
            <div class="headset-left"></div>
            <div class="headset-band"></div>
            <div class="headset-right"></div>
        </div>
        
        <!-- 耳机支架 -->
        <div class="headset-dock">
            <div class="dock-left"></div>
            <div class="dock-right"></div>
        </div>
        
        <!-- 终端主体 -->
        <div class="terminal-body">
            <!-- 角落装饰 -->
            <div class="corner-decor top-left"></div>
            <div class="corner-decor top-right"></div>
            <div class="corner-decor bottom-left"></div>
            <div class="corner-decor bottom-right"></div>
            
            <!-- 全息显示屏 -->
            <div class="hologram-display">
                <span class="display-label">FREQ://</span>
                <div class="display-text empty" id="display">---</div>
            </div>
            
            <!-- 触控拨号盘 -->
            <div class="dial-interface">
                <!-- 外环底座 -->
                <div class="dial-outer-ring"></div>
                
                <!-- 触控拨号盘 -->
                <div class="touch-plate locked" id="dialPlate">
                    <!-- 触控节点将通过JS生成 -->
                </div>
                
                <!-- 中心控制区 -->
                <div class="center-hub"></div>
                
                <!-- 激活标记 -->
                <div class="activation-marker"></div>
            </div>
            
            <!-- 状态指示器 -->
            <div class="status-indicator" id="statusLight"></div>
            
            <!-- 信号强度 -->
            <div class="signal-bars" id="signalBars">
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
                <div class="signal-bar"></div>
            </div>
        </div>
    </div>
    
    <!-- 第二条扫描线 -->
    <div class="scanline-second"></div>

    <!-- CRT信号撕裂效果层 -->
    <div class="signal-glitch" id="signalGlitch"></div>
    <div class="noise-overlay" id="noiseOverlay"></div>

    <!-- 赛博便签 - 电话表 -->
    <div class="cyber-note" id="cyberNote">
        <div class="note-handle"></div>
        <div class="cyber-note-header">CONTACT_LIST</div>
        <div class="contact-item">
            <div class="pixel-icon icon-github"></div>
            <span>- 101</span>
        </div>
        <div class="contact-item">
            <div class="pixel-icon icon-bilibili"></div>
            <span>- 031</span>
        </div>
        <div class="contact-item">
            <div class="pixel-icon icon-qq"></div>
            <span>- 995</span>
        </div>
        <div class="contact-item">
            <div class="pixel-icon icon-mystery"></div>
            <span>- 404</span>
        </div>
        <div class="contact-item">
            <div class="pixel-icon icon-blackhole">
                <div class="ring-inner"></div>
                <div class="jets"></div>
            </div>
            <span>- 591</span>
        </div>
        <div class="contact-item">
            <div class="pixel-icon icon-email"></div>
            <span>- 173</span>
        </div>
    </div>

    <!-- 使用说明 -->
    <div class="instructions">
        <p>点击<span class="key">HEADSET</span>激活通讯 | 激活后按住<span class="key">NODE</span>顺时针旋转拨号</p>
        <p>INTERSTELLAR COMMUNICATION TERMINAL // 星际通讯终端</p>
    </div>

    <script src="js/contact-call.js"></script>
</body>
</html>
